name: Pactra mobility core tests

on:
  push:
    branches: [main]
    paths:
      - 'src/pactra/core.js'
      - 'test/core.test.js'
      - '.github/workflows/pactra-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/pactra/core.js'
      - 'test/core.test.js'
      - '.github/workflows/pactra-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pactra-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run Pactra core tests
        run: node --test test/core.test.js
